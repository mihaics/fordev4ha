reset_range_model:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: ford_ev
add_charge:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: ford_ev
    date:
      required: true
      selector:
        datetime:
    energy_kwh:
      required: true
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    location:
      required: true
      selector:
        select:
          options:
            - home
            - public
          translation_key: location
    charging_type:
      required: false
      selector:
        select:
          options:
            - ac
            - dc
          translation_key: charging_type
    solar_share:
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: box
    cost:
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
set_period_odometer:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: ford_ev
    period:
      required: true
      selector:
        select:
          options:
            - day
            - week
            - month
            - year
          translation_key: period
    odometer:
      required: true
      selector:
        number:
          min: 0
          max: 2000000
          step: 1
          mode: box
